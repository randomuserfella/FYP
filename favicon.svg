<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c6af7"/>
      <stop offset="100%" style="stop-color:#5b49e0"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a89cf9"/>
      <stop offset="100%" style="stop-color:#7c6af7"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="64" height="64" rx="14" ry="14" fill="url(#bg)"/>

  <!-- Clock ring -->
  <circle cx="32" cy="32" r="20" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="3"/>

  <!-- Clock tick marks -->
  <line x1="32" y1="14" x2="32" y2="17" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="47" x2="32" y2="50" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-linecap="round"/>
  <line x1="14" y1="32" x2="17" y2="32" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-linecap="round"/>
  <line x1="47" y1="32" x2="50" y2="32" stroke="rgba(255,255,255,0.5)" stroke-width="2" stroke-linecap="round"/>

  <!-- Clock hands -->
  <line x1="32" y1="32" x2="32" y2="20" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="32" x2="40" y2="36" stroke="#fff" stroke-width="2" stroke-linecap="round"/>

  <!-- Centre dot -->
  <circle cx="32" cy="32" r="2.5" fill="#fff"/>

  <!-- Small progress arc overlay (top-right quarter) to suggest tracking -->
  <path d="M32 12 A20 20 0 0 1 52 32" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="3" stroke-linecap="round"/>
</svg>
